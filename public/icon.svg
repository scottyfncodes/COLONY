<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#140e0c"/>
      <stop offset="0.38" stop-color="#3a1c12"/>
      <stop offset="0.6" stop-color="#9a4322"/>
      <stop offset="0.68" stop-color="#d8783a"/>
    </linearGradient>
    <radialGradient id="sun" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ffd38a" stop-opacity="0.95"/>
      <stop offset="0.35" stop-color="#f29a4a" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#f29a4a" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="fireglow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ffb04a" stop-opacity="0.75"/>
      <stop offset="1" stop-color="#ff7a2a" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="ground" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1c130e"/>
      <stop offset="1" stop-color="#0b0807"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" fill="url(#sky)"/>
  <!-- drifting smoke bands -->
  <path d="M0 150 C 120 120, 220 175, 340 140 S 512 120, 512 120 L512 175 C 400 190, 300 160, 200 190 S 40 185, 0 200 Z" fill="#1a110d" opacity="0.3"/>
  <!-- low hazy sun -->
  <circle cx="318" cy="318" r="120" fill="url(#sun)"/>
  <!-- ruined skyline -->
  <path fill="#120c0a" d="
    M0 352 L0 250 L22 250 L22 232 L46 238 L52 214 L70 226 L78 196 L96 212 L104 352
    L118 352 L118 286 L150 286 L150 270 L166 278 L172 300 L184 292 L184 352
    L214 352 L214 312 L236 312 L236 352
    L330 352 L330 206 L342 206 L342 352 L346 352 L346 230 L398 230 L398 214 L410 214 L404 262 L392 270 L392 352
    L420 352 L420 292 L446 280 L462 300 L470 288 L484 296 L484 352
    L512 352 L512 512 L0 512 Z"/>
  <!-- broken girder frame and leaning pylon -->
  <g stroke="#120c0a" stroke-width="5" fill="none">
    <path d="M346 262 L392 230 M346 230 L392 262 M346 296 L392 270 M346 270 L392 296"/>
    <path d="M262 352 L284 236 L306 352 M270 310 L298 310 M276 278 L292 278 M284 236 L254 246 M284 236 L316 230"/>
  </g>
  <!-- ground -->
  <path d="M0 352 L512 352 L512 512 L0 512 Z" fill="url(#ground)"/>
  <!-- barbed-wire fence silhouetted on the horizon -->
  <g stroke="#0d0907" stroke-linecap="round">
    <g stroke-width="7">
      <path d="M30 380 L30 312"/><path d="M110 372 L110 306"/><path d="M402 372 L402 306"/><path d="M482 380 L482 312"/>
    </g>
    <g stroke-width="3" fill="none">
      <path d="M30 322 L110 316 M402 316 L482 322"/>
      <path d="M30 344 L110 338 M402 338 L482 344"/>
      <path d="M30 312 Q 70 300 110 306 M402 306 Q 442 300 482 312"/>
    </g>
    <g stroke-width="2.5">
      <path d="M52 316 l8 -8 M52 308 l8 8 M84 313 l8 -8 M84 305 l8 8 M424 313 l8 -8 M424 305 l8 8 M456 316 l8 -8 M456 308 l8 8"/>
    </g>
  </g>
  <!-- fire glow on the ground -->
  <ellipse cx="310" cy="450" rx="190" ry="70" fill="url(#fireglow)"/>
  <!-- survivor: hooded coat, bedroll pack, hands out to the fire; rim-lit on the fire side -->
  <g fill="#0a0706">
    <ellipse cx="166" cy="350" rx="20" ry="11"/>
    <rect x="148" y="352" width="34" height="58" rx="8"/>
    <path d="M200 296 C 186 296, 178 308, 179 322 C 180 334, 186 342, 196 344 L 214 344 C 220 336, 222 326, 220 314 C 218 302, 210 296, 200 296 Z"/>
    <path d="M182 346 C 188 340, 214 338, 224 346 C 230 356, 234 384, 236 424 L 220 426 L 222 458 L 210 458 L 204 428 L 198 428 L 192 458 L 180 458 L 182 426 L 172 424 C 172 392, 174 360, 182 346 Z"/>
    <path d="M222 352 C 236 360, 248 374, 262 386 L 256 396 C 242 386, 228 376, 218 366 Z"/>
  </g>
  <g stroke="#f39a44" stroke-width="3" fill="none" stroke-linecap="round" opacity="0.9">
    <path d="M214 304 C 220 312, 221 326, 215 338"/>
    <path d="M232 362 C 244 370, 254 380, 262 386"/>
    <path d="M230 392 C 233 404, 235 414, 236 424"/>
    <path d="M221 432 L 222 456"/>
  </g>
  <!-- fire barrel -->
  <path d="M286 410 L340 410 L336 466 L290 466 Z" fill="#1a120d"/>
  <path d="M288 424 L338 424 M289 448 L337 448" stroke="#3a2618" stroke-width="3"/>
  <path d="M340 410 L336 466" stroke="#f0913c" stroke-width="2" opacity="0.6"/>
  <path fill="#ff8a2a" d="M292 410 C 290 392, 302 386, 300 370 C 312 380, 316 360, 314 348 C 328 362, 330 380, 324 390 C 332 386, 336 378, 336 372 C 344 388, 340 402, 334 410 Z"/>
  <path fill="#ffd36a" d="M302 410 C 302 398, 310 394, 310 384 C 318 392, 322 400, 320 410 Z"/>
  <!-- embers -->
  <g fill="#ffb04a">
    <circle cx="322" cy="332" r="3"/><circle cx="306" cy="314" r="2.5"/><circle cx="330" cy="300" r="2"/>
  </g>
</svg>
